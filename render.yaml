services:
  - type: web
    name: edutrack-pro-backend
    runtime: python
    plan: free
    rootDir: edutrack-pro-fullstack/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py seed_sample_data
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5174,http://127.0.0.1:5174
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,http://localhost:5174,http://127.0.0.1:5174
      - key: DATABASE_URL
        fromDatabase:
          name: edutrack-pro-db
          property: connectionString

databases:
  - name: edutrack-pro-db
    plan: free
