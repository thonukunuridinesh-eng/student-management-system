<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: #111827;
            background: linear-gradient(
                -45deg,
                #020617,
                #0f172a,
                #1e3a8a,
                #4f46e5,
                #7c3aed,
                #06b6d4
            );
            background-size: 400% 400%;
            animation: gradientMove 14s ease infinite;
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            z-index: -1;
            animation: floatShape 9s ease-in-out infinite alternate;
        }

        .shape1 {
            width: 320px;
            height: 320px;
            background: #38bdf8;
            top: 8%;
            left: 5%;
        }

        .shape2 {
            width: 380px;
            height: 380px;
            background: #a855f7;
            bottom: 8%;
            right: 7%;
            animation-delay: 1.5s;
        }

        .shape3 {
            width: 260px;
            height: 260px;
            background: #22c55e;
            top: 45%;
            left: 42%;
            animation-delay: 2.5s;
        }

        .shape4 {
            width: 220px;
            height: 220px;
            background: #f97316;
            top: 18%;
            right: 20%;
            animation-delay: 3s;
        }

        .navbar {
            padding: 30px 20px;
            text-align: center;
            color: white;
            animation: slideDown 0.8s ease;
        }

        .navbar h2 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 1px;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }

        .navbar p {
            margin-top: 10px;
            opacity: 0.9;
            font-size: 16px;
        }

        .container {
            width: 90%;
            margin: 25px auto 50px;
            padding: 32px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.45);
            animation: fadeUp 0.9s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 16px 35px rgba(79, 70, 229, 0.45);
        }

        .btn-edit {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        .btn-delete {
            background: linear-gradient(135deg, #dc2626, #f97316);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 18px;
            background: white;
        }

        th {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 16px;
            font-size: 14px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        tr {
            transition: 0.3s;
            animation: fadeRow 0.6s ease;
        }

        tr:hover {
            background: #eef2ff;
            transform: scale(1.01);
        }

        form {
            max-width: 650px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
        }

        form p {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        input {
            margin-top: 8px;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            outline: none;
            transition: 0.3s;
            font-size: 15px;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 5px rgba(124, 58, 237, 0.15);
        }

        .empty-box {
            padding: 45px;
            text-align: center;
            color: #64748b;
            font-size: 18px;
            background: white;
            border-radius: 18px;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes floatShape {
            from {
                transform: translateY(0px) translateX(0px) scale(1);
            }
            to {
                transform: translateY(-55px) translateX(45px) scale(1.1);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeRow {
            from {
                opacity: 0;
                transform: translateX(-15px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 18px;
                overflow-x: auto;
            }

            .top-bar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .navbar h2 {
                font-size: 26px;
            }

            .shape1,
            .shape2,
            .shape3,
            .shape4 {
                width: 220px;
                height: 220px;
            }
        }
        .form-page {
    animation: fadeUp 0.8s ease;
}

.form-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding: 25px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(37,99,235,0.12), rgba(124,58,237,0.12));
    border: 1px solid rgba(124,58,237,0.2);
}

.badge {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
}

.form-header h1 {
    margin: 0;
    color: #0f172a;
    font-size: 34px;
}

.form-header p {
    margin: 8px 0 0;
    color: #64748b;
}

.premium-form {
    max-width: 850px;
    margin: auto;
    padding: 35px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 25px 60px rgba(15, 23, 42, 0.18);
    animation: formPop 0.8s ease;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.input-group {
    display: flex;
    flex-direction: column;
    animation: inputSlide 0.6s ease;
}

.input-group label {
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 8px;
}

.input-group input,
.input-group select,
.input-group textarea {
    width: 100%;
    padding: 15px 16px;
    border-radius: 16px;
    border: 1px solid #cbd5e1;
    background: rgba(255,255,255,0.95);
    outline: none;
    font-size: 15px;
    transition: 0.3s;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 5px rgba(124,58,237,0.16);
    transform: translateY(-2px);
}

.input-group small {
    color: #dc2626;
    margin-top: 6px;
}

.save-btn {
    margin-top: 30px;
    width: 100%;
    padding: 16px;
    font-size: 17px;
    border-radius: 18px;
    background: linear-gradient(135deg, #2563eb, #7c3aed, #06b6d4);
    background-size: 200% 200%;
    animation: gradientMove 5s ease infinite;
}

.back-btn {
    white-space: nowrap;
}

@keyframes formPop {
    from {
        opacity: 0;
        transform: scale(0.96) translateY(25px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes inputSlide {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .form-header {
        flex-direction: column;
        gap: 18px;
        text-align: center;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .premium-form {
        padding: 22px;
    }

    .form-header h1 {
        font-size: 26px;
    }
}
    </style>
</head>

<body>

<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>
<div class="bg-shape shape3"></div>
<div class="bg-shape shape4"></div>

<div class="navbar">
    <h2>🎓 Student Management System</h2>
    <p>Manage student records, attendance and marks professionally</p>
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
